name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }} 
     
jobs:
    unit-testing:
        name: Unit Testing
        strategy:
            matrix:
                nodejs_version: [18, 20]
                operating_system: [ubuntu-latest, macos-latest]
                exclude:
                    - nodejs_version: 18
                      operating_system: macos-latest
        runs-on: ${{ matrix.operating_system }}
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version - ${{ matrix.nodejs_version }}
          uses: actions/setup-node@v3
          with:
            node-version: ${{ matrix.nodejs_version }}
        
        - name: Cache NPM Dependencies
          uses: actions/cache@v5
          with: 
            path: node_modules
            key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}
    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
        
        - name: Debug step
          if: always()
          run: |
            echo "PWD=$(pwd)"
            echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            ls -la
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -name "test-results.xml"

        - name: Archive unit test results
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: mocha-test-result-${{ matrix.nodejs_version }}
            path: ${{ github.workspace }}/**/test-results.xml
            if-no-files-found: error
    
    code-coverage:
        name: Code Coverage
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version - 18
          uses: actions/setup-node@v3
          with:
            node-version: 18

        #- name: Composite Action - Cache & Install NPM Packages
        #  uses: ./.github/custom-actions/npm-action
        #  with:
        #    path-of-folder: node_modules
        - name: Cache NPM Dependencies
          uses: actions/cache@v5
          with: 
            path: node_modules
            key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}
                    
        - name: Install Dependencies
          run: npm install

        - name: Check Code Coverage
          continue-on-error: true
          run: npm run coverage

        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5    
